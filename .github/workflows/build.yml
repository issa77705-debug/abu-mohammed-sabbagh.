
name: Build Abu Mohammed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q abu_mohammed_sabbagh_android_project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/abu_mohammed_sabbagh_android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Mohammed-Sabbagh-APK
          path: extracted/abu_mohammed_sabbagh_android/app/build/outputs/apk/debug/app-debug.apk
          
